name: Probe (debug)
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Mellemrumsseparerede URLs"
        required: true
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - env:
          URLS: ${{ github.event.inputs.urls }}
        run: python tools/probe.py $URLS
      - name: Gem output på probe-out-branch
        if: always()
        run: |
          git config user.name "job-finder"
          git config user.email "actions@users.noreply.github.com"
          git checkout -q --orphan probe-out-${{ github.run_id }}
          git rm -rqf --cached .
          git add -f probe-out
          git commit -qm "probe output"
          git push -q origin HEAD

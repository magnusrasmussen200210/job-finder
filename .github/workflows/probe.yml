name: Probe (debug)
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Mellemrumsseparerede URLs"
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - env:
          URLS: ${{ github.event.inputs.urls }}
        run: python tools/probe.py $URLS

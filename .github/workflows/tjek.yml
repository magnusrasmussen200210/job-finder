name: Tjek job
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Kun log, send ikke Telegram"
        type: boolean
        default: false
concurrency:
  group: tjek
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  tjek:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Find og send job
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m finder.main ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
      - name: Gem hvilke job der er set
        if: always()
        run: |
          git config user.name "job-finder"
          git config user.email "actions@users.noreply.github.com"
          [ -d state ] || exit 0
          git add state/
          git diff --cached --quiet || (git commit -qm "Opdater sete job" && git pull -q --rebase && git push -q)
